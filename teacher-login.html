<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>دخول الأستاذ — نظام الامتحانات</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="center-page">
    <div class="container-narrow">
      <div class="login-hero">
        <div class="mark">EN</div>
        <h1>دخول الأستاذ</h1>
        <p class="muted">لوحة تحكم إدارة الامتحانات</p>
      </div>

      <div class="card">
        <div id="alertBox" class="hidden"></div>

        <form id="loginForm">
          <div class="field">
            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" required autocomplete="username" placeholder="teacher@example.com" />
          </div>
          <div class="field">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
          </div>
          <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
            <span id="btnText">تسجيل الدخول</span>
          </button>
        </form>
      </div>

      <div class="role-switch">
        <span class="muted">لست أستاذًا؟</span>
        <a href="student-login.html">دخول الطالب</a>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const alertBox = document.getElementById("alertBox");
    const form = document.getElementById("loginForm");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");

    // إن كان الأستاذ مسجّل الدخول أصلًا، حوّله مباشرة إلى لوحة التحكم
    auth.onAuthStateChanged((user) => {
      if (user && !user.isAnonymous) {
        db.collection(COLLECTIONS.TEACHERS).doc(user.uid).get().then((doc) => {
          if (doc.exists) window.location.href = "teacher-dashboard.html";
        });
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert(alertBox);
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showAlert(alertBox, "يرجى إدخال البريد الإلكتروني وكلمة المرور.", "error");
        return;
      }

      submitBtn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> جاري التحقق...';

      try {
        await teacherLogin(email, password);
        window.location.href = "teacher-dashboard.html";
      } catch (err) {
        console.error(err);
        showAlert(alertBox, translateFirebaseError(err), "error");
        submitBtn.disabled = false;
        btnText.textContent = "تسجيل الدخول";
      }
    });
  </script>
</body>
</html>
